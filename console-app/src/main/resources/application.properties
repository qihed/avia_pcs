# =====================================================================
# ИС «АВИА-БРОНЬ» — параметры консольного приложения.
# Значения вида ${VAR:default} берутся по порядку: системное свойство -DVAR,
# переменная окружения VAR, файл .env в каталоге запуска, значение по умолчанию.
# Секретов в файле нет: пароль БД задаётся только в .env (NFR-11).
# =====================================================================

# Подключение к PostgreSQL. Пароль по умолчанию пустой: его задаёт .env.
app.db.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:avia_booking}?currentSchema=avia}
app.db.user=${DB_USER:${POSTGRES_USER:avia_app}}
app.db.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}
app.db.connect-timeout-seconds=5

# Демонстрационный набор данных (приложение Б ТЗ) загружается миграцией V2 при первом запуске.
app.db.demo-data=${DEMO_DATA:true}

# Бизнес-правила BR-01, BR-08, BR-09.
app.booking.sale-close-minutes=60
app.booking.cancel-hours=2
app.booking.expire-minutes=30

# Каталог выгрузки отчётов и часовой пояс приложения (CON-06).
app.export.directory=${EXPORT_DIR:exports}
app.time-zone=${APP_TIME_ZONE:Europe/Moscow}

# Журнал пишет slf4j-simple (см. simplelogger.properties); значение выводится в стартовой памятке.
app.log-file=avia-booking.log
