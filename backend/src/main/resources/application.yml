spring:
  application:
    name: avia-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/avia_booking}
    username: ${SPRING_DATASOURCE_USERNAME:avia_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  jackson:
    default-property-inclusion: non_null

  autoconfigure:
    # пользователи хранятся в БД, встроенный пользователь с генерируемым паролем не нужен
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:avia-backend}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}

  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL}
    name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
    password: ${BOOTSTRAP_ADMIN_PASSWORD}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}

  security:
    # после стольких неверных паролей подряд вход блокируется на lock-minutes
    max-failed-attempts: 5
    lock-minutes: 15
    # true: Swagger доступен только с Bearer-токеном ADMIN; false: страница открыта, а защищённые запросы требуют токен
    swagger-admin-only: ${SWAGGER_ADMIN_ONLY:false}

  permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:false}

  pagination:
    max-page-size: 100
    default-page-size: 20
