<rect x="30" y="822" width="940" height="160" fill="#f3f6fa" stroke="#c7d0dd"/>
<text x="44" y="846" class="note">PK — первичный ключ, FK — внешний ключ, UQ — уникальность, NN — NOT NULL.</text>
<text x="44" y="866" class="note">UQ¹ — пара (document_type, document_number) уникальна; UQ² — пара (flight_number, departure_time) уникальна.</text>
<text x="44" y="886" class="note">Частичные уникальные индексы (только для броней в статусах, отличных от CANCELLED и EXPIRED):</text>
<text x="64" y="906" class="note">uq_bookings_flight_seat_active (flight_id, seat_number) — правило BR-03;</text>
<text x="64" y="926" class="note">uq_bookings_flight_passenger_active (flight_id, passenger_id) — правило BR-04.</text>
<text x="44" y="946" class="note">CHECK: место ^[0-9]{1,2}[A-F]$, PNR ^[A-Z0-9]{6}$, price &gt; 0, статусы и классы — значения перечислений,</text>
<text x="64" y="966" class="note">arrival_time &gt; departure_time, departure_airport &lt;&gt; arrival_airport, total_seats 1..600, base_price &gt; 0, e-mail.</text>
</svg>